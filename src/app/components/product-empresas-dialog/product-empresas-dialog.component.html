<h2 mat-dialog-title class="dialog-title text-center text-light fw-bold">
  Tiendas de "{{ data.title }}"
</h2>

<mat-dialog-content class="p-0">

  <!-- Si hay empresas -->
  <ng-container *ngIf="hayEmpresas; else noEmpresas">
    <div id="empresaCarousel" class="carousel slide" data-bs-ride="carousel">
      
      <!-- Indicadores -->
      <div class="carousel-indicators">
        <button *ngFor="let empresa of data.empresas; let i = index"
                type="button"
                [attr.data-bs-target]="'#empresaCarousel'"
                [attr.data-bs-slide-to]="i"
                [class.active]="i === 0"
                [attr.aria-current]="i === 0 ? 'true' : null"
                [attr.aria-label]="'Slide ' + (i + 1)">
        </button>
      </div>

      <!-- Carrusel -->
      <div class="carousel-inner">

        <div *ngFor="let empresa of data.empresas; let i = index"
             class="carousel-item"
             [class.active]="i === 0">
          
          <!-- Imagen de fondo (puedes reemplazar con tu propia imagen de vitrina si prefieres) -->
          <img src="assets/images/vitrina2.png"
               class="d-block w-100 carousel-background"
               alt="Fondo vitrina">

          <!-- Contenido centrado -->
          <div class="carousel-caption d-flex flex-column align-items-center justify-content-center h-100">
            
            <!-- Logo de empresa -->
            <!-- <img [src]="'assets/images/logos/' + empresa.logoUrl"
                 alt="Logo {{ empresa.nombre }}"
                 class="empresa-logo-carousel mb-3"> -->

            <!-- Nombre -->
            <h5 class="text-white fw-bold">{{ empresa.nombre }}</h5>

            <!-- Descripción -->
            <p class="text-light small">{{ empresa.descripcion }}</p>

            <!-- Botón para ir a productos -->
            <button class="btn btn-outline-light btn-sm mt-2"
                    (click)="irAProdcutos(empresa.id_empresa)">
              <i class="bi bi-box-arrow-in-right me-1"></i> Ingresar
            </button>

          </div>
        </div>

      </div>

      <!-- Controles -->
      <button class="carousel-control-prev" type="button" data-bs-target="#empresaCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Anterior</span>
      </button>
      <button class="carousel-control-next" type="button" data-bs-target="#empresaCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Siguiente</span>
      </button>
    </div>
  </ng-container>

  <!-- Si no hay empresas -->
  <ng-template #noEmpresas>
    <p class="text-muted text-center py-4">No hay tiendas asociadas a este producto.</p>
  </ng-template>
</mat-dialog-content>

<!-- Footer con botón cerrar -->
<mat-dialog-actions align="end">
  <button class="btn btn-outline-light btn-sm" (click)="close()">Cerrar</button>
</mat-dialog-actions>
