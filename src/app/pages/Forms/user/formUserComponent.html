<app-breadcrumb pageTitle="Tiendas Categorías"></app-breadcrumb>

<div class="container user-form-container py-4">
  <h2 class="mb-4 text-center">Selecciona una categoría</h2>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col" *ngFor="let product of products">
      <div class="card h-100 card-hover" (click)="abrirModal(product)">
       <img [src]="product.image" class="card-img-top" alt="{{ product.nombre }}" />
        <div class="card-body">
          <h5 class="card-title">{{ product.nombre }}</h5>
          <p class="card-text">{{ product.descripcion }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
