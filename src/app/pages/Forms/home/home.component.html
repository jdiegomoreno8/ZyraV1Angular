<!-- home.component.html -->
<app-breadcrumb pageTitle="Menú Principal"></app-breadcrumb>

<div class="container my-4">
  <div class="row g-4 justify-content-center">

    <!-- Tarjeta: Productos -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div
        class="menu-tile"
        (click)="go('form-user')"
        [class.loading]="isLoading && loadingTarget === 'form-user'"
      >
        <i class="fa-solid fa-store icon"></i>
        <h5>Productos</h5>
        <ng-container *ngIf="!isLoading || loadingTarget !== 'form-user'; else loadingProductos">
          <p>Explora el catálogo de productos</p>
        </ng-container>
        <ng-template #loadingProductos>
          <div class="spinner-border text-primary mt-2" role="status"></div>
        </ng-template>
      </div>
    </div>

    <!-- Tarjeta: Historial -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div
        class="menu-tile"
        (click)="go('history')"
        [class.loading]="isLoading && loadingTarget === 'history'"
      >
        <i class="fas fa-history icon"></i>
        <h5>Historial</h5>
        <ng-container *ngIf="!isLoading || loadingTarget !== 'history'; else loadingHistorial">
          <p>Revisa tus compras o visitas anteriores</p>
        </ng-container>
        <ng-template #loadingHistorial>
          <div class="spinner-border text-primary mt-2" role="status"></div>
        </ng-template>
      </div>
    </div>

    <!-- Tarjeta: Ajustes -->
    <div class="col-12 col-sm-6 col-lg-4">
      <div
        class="menu-tile"
        (click)="go('form-settings')"
        [class.loading]="isLoading && loadingTarget === 'form-settings'"
      >
        <i class="fas fa-cogs icon"></i>
        <h5>Ajustes</h5>
        <ng-container *ngIf="!isLoading || loadingTarget !== 'form-settings'; else loadingAjustes">
          <p>Configura tu cuenta y preferencias</p>
        </ng-container>
        <ng-template #loadingAjustes>
          <div class="spinner-border text-primary mt-2" role="status"></div>
        </ng-template>
      </div>
    </div>

  </div>
</div>
