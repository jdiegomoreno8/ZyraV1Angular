<div class="container py-4">
  <h2>Anular Cita</h2>

  <div class="alert alert-warning">
    ⚠️ Estás a punto de anular la siguiente cita:
  </div>

  <div class="mb-3">
    <p><strong>Cliente:</strong> {{ cita?.nombre }} {{ cita?.apellido }}</p>
    <p><strong>Fecha:</strong> {{ cita?.fecha }} | <strong>Hora:</strong> {{ cita?.hora }}</p>
    <p><strong>Ticket:</strong> {{ cita?.numero_ticket }}</p>
    <p><strong>Productos:</strong> {{ cita?.cantidad_productos }}</p>
    <p><strong>Total:</strong> ${{ cita?.total_pagar }}</p>
  </div>

  <div class="mb-3">
    <label for="comentario" class="form-label">Motivo de anulación</label>
    <textarea
      id="comentario"
      class="form-control"
      rows="4"
      [(ngModel)]="comentario"
      placeholder="Ejemplo: Cliente no se presentará..."
    ></textarea>
  </div>

  <div class="d-flex gap-2">
    <button class="btn btn-danger" (click)="anularCita()" [disabled]="loading">Confirmar Anulación</button>
    <button class="btn btn-secondary" (click)="cancelar()">Cancelar</button>
  </div>

  <div *ngIf="mensaje" class="alert alert-info mt-3">
    {{ mensaje }}
  </div>
</div>
