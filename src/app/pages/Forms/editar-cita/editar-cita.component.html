<!-- editar-cita.component.html -->
<div class="editar-cita-container">
  <div class="card shadow border-0">
    <div class="card-header d-flex align-items-center justify-content-between">
      <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i>Editar Cita</h4>
      <span class="badge bg-light text-dark">{{ citaForm.get('numero_ticket')?.value }}</span>
    </div>

    <form [formGroup]="citaForm" class="card-body" [class.disabled]="!editable">
      <div class="row g-3">
        <!-- Datos personales -->
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-person-fill"></i> Nombre</label>
          <input formControlName="nombre" class="form-control" placeholder="Nombre completo" />
        </div>
        <div class="col-md-6">
          <label class="form-label">Apellido</label>
          <input formControlName="apellido" class="form-control" placeholder="Apellido" />
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-telephone-fill"></i> Teléfono</label>
          <input formControlName="telefono" class="form-control" placeholder="Teléfono" />
        </div>
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-envelope-fill"></i> Correo</label>
          <input formControlName="correo" class="form-control" type="email" placeholder="Correo" />
        </div>

        <!-- Dirección -->
        <div class="col-md-12">
          <label class="form-label"><i class="bi bi-geo-alt-fill"></i> Dirección</label>
          <input formControlName="direccion" class="form-control" placeholder="Dirección exacta" />
        </div>

<!-- Campo Domicilio -->
<div class="col-md-6">
  <label class="form-label">¿Domicilio?</label>
  <select formControlName="domicilio" class="form-select" (change)="onMetodoEntregaChange()">
    <option value="">Seleccione</option>
    <option value="si">Sí</option>
    <option value="no">No</option>
  </select>
</div>

<!-- MAPA: solo se muestra si domicilio es "si" -->
<div class="col-12 mt-3" *ngIf="citaForm.value.domicilio === 'si'">
  <label class="form-label"><i class="bi bi-geo-alt-fill"></i> Ubicación en Mapa</label>
  <div id="map" style="width: 100%; height: 300px; border: 1px solid #ccc;"></div>
</div>


        <div class="col-md-3">
          <label class="form-label"><i class="bi bi-calendar"></i> Fecha</label>
          <input formControlName="fecha" type="date" class="form-control" />
        </div>
  <!-- Horas disponibles -->
<label>Hora:</label>
<select formControlName="hora">
  <option *ngFor="let hora of horasDisponibles" [value]="hora">{{ hora }}</option>
</select>

        <!-- Empresa y pago -->
        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-building"></i> Empresa</label>
          <input class="form-control" [value]="empresaSeleccionada?.nombre || 'Cargando...'" disabled />
        </div>

        <div class="col-md-6">
          <label class="form-label"><i class="bi bi-credit-card-2-front"></i> Método de Pago</label>
          <select formControlName="id_pago" class="form-select">
            <option *ngFor="let m of metodosPago" [value]="m.id_pago">{{ m.metodo }}</option>
          </select>
        </div>

        <!-- Productos -->
        <div class="col-12 mt-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label class="form-label mb-0"><i class="bi bi-box-seam"></i> Productos</label>
            <button type="button" class="btn btn-outline-primary btn-sm" (click)="agregarProducto()">
              <i class="bi bi-plus-lg"></i> Agregar
            </button>
          </div>

          <div class="productos-scroll">
            <div
              class="row g-2 mb-2 align-items-center"
              *ngFor="let prod of productosFormArray.controls; let i = index"
              [formGroupName]="i"
            >
              <div class="col-md-6">
                <select
                  formControlName="id_producto"
                  class="form-select"
                  (change)="recalcularTotales()"
                >
                  <option *ngFor="let p of productosDisponibles" [value]="p.id_producto">
                     {{ p.nombre }} — {{ p.precio | currency:'COL':'symbol':'1.0-0' }}
                  </option>
                </select>
              </div>
              <div class="col-md-3">
                <input
                  formControlName="cantidad"
                  type="number"
                  min="1"
                  class="form-control"
                  placeholder="Cantidad"
                  (input)="recalcularTotales()"
                />
              </div>
              <div class="col-md-3 text-end">
                <button
                  type="button"
                  class="btn btn-outline-danger btn-sm"
                  (click)="eliminarProducto(i)"
                >
                  <i class="bi bi-trash"></i>
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Totales -->
        <div class="col-md-6">
          <label class="form-label">Valor Productos</label>
          <input formControlName="valor_productos" class="form-control" [readonly]="true" />

        </div>
        <div class="col-md-6">
          <label class="form-label">Total a Pagar</label>
          <input formControlName="total_pagar" class="form-control" [readonly]="true" />
        </div>

        <!-- Observaciones -->
        <div class="col-12">
          <label class="form-label"><i class="bi bi-chat-dots"></i> Observaciones</label>
          <textarea formControlName="observaciones" class="form-control" rows="3"></textarea>
        </div>
      </div>

      <div class="text-end mt-4">
        <button type="button" class="btn btn-success px-4" (click)="guardarCambios()" [disabled]="citaForm.invalid">
          <i class="bi bi-check2-circle me-2"></i> Guardar Cambios
        </button>
      </div>
    </form>
    <div *ngIf="!editable" class="alert alert-warning mt-3">
  ⚠️ Esta cita no se puede editar porque faltan menos de 2 horas para la entrega.
</div>

  </div>
</div>
