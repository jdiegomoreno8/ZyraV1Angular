<app-breadcrumb pageTitle="Agendamiento de cita"></app-breadcrumb>
<app-sidebar></app-sidebar>

<div class="container my-5 d-flex justify-content-center">
  <div class="card-calendar shadow-lg">
    <div class="icon-container">
      <i class="fa-solid fa-calendar-days fa-3x text-primary"></i>
    </div>
    <h3 class="mt-2">Elige tu fecha</h3>
    <p class="text-muted">Escoge la fecha en que deseas programar tu cita</p>

    <mat-form-field appearance="outline" class="w-100 mt-3">
      <mat-label>Fecha</mat-label>
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <input
        matInput
        [matDatepicker]="picker"
        [min]="today"
        (dateChange)="onDateSelected($event.value)"
        [value]="selectedDate"
        placeholder="Selecciona una fecha"
      />
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <div class="mt-3">
      <p *ngIf="!selectedDate" class="text-warning fw-semibold">
        ⚠️ Aún no has seleccionado una fecha
      </p>
      <p *ngIf="selectedDate" class="text-success fw-semibold">
         Fecha seleccionada: <span>{{ selectedDate | date: 'fullDate' }}</span>
      </p>
    </div>

    <button
      class="btn btn-primary mt-4 w-100 btn-next"
      [disabled]="!selectedDate"
      (click)="goToSchedule()"
    >
      <i class="fas fa-arrow-right me-2"></i> Continuar
    </button>
  </div>
</div>
