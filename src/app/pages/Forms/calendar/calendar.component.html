<app-breadcrumb pageTitle="Agendamiento de cita"></app-breadcrumb>
<app-sidebar></app-sidebar>

<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="calendar-container text-center p-4">
        <h2 class="mb-4">
          <i class="fa-solid fa-calendar-check me-2 text-primary"></i>
          Agenda tu cita
        </h2>

        <p>Selecciona una fecha a partir de hoy:</p>

        <!-- Calendario -->
        <div class="d-flex justify-content-center">
          <mat-form-field appearance="outline" class="w-100">
            <mat-label>Fecha</mat-label>
            <mat-datepicker-toggle matSuffix [for]="picker">
              <i class="fa-solid fa-calendar-day"></i>
            </mat-datepicker-toggle>
            <input 
              matInput 
              [matDatepicker]="picker" 
              [min]="today" 
              (dateChange)="onDateSelected($event.value)" 
              [value]="selectedDate" 
              placeholder="Selecciona una fecha"
            />
            <mat-datepicker #picker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- Mensaje de estado -->
        <div class="mt-3">
          <p *ngIf="!selectedDate" class="text-warning fw-bold">
            ⚠️ Aún no has seleccionado una fecha
          </p>
          <p *ngIf="selectedDate" class="text-success fw-bold">
            ✅ Fecha seleccionada: {{ selectedDate | date: 'fullDate' }}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
